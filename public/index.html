<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8ef">
<meta name="description" content="Play 2048 - slide and combine matching tiles to reach the 2048 tile. Mobile-friendly, swipe or use arrow keys.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23edc22e%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%23fff%22 text-anchor=%22middle%22>2</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-value" id="best-score">0</div>
      </div>
    </div>
  </header>

  <div class="above-game">
    <p class="game-intro">Join the tiles, get to <strong>2048!</strong></p>
    <button class="new-game-button" id="new-game">New Game</button>
  </div>

  <div class="game-container" id="game-container">
    <div class="grid-background" id="grid-background"></div>
    <div class="tile-container" id="tile-container"></div>
    <div class="game-message" id="game-message">
      <p id="game-message-text"></p>
      <div class="lower">
        <button class="keep-playing-button" id="keep-playing-button">Keep going</button>
        <button class="retry-button" id="retry-button">Try again</button>
      </div>
    </div>
  </div>

  <p class="game-explanation">
    <strong>How to play:</strong> Use your arrow keys (or swipe on mobile) to move the tiles.
    When two tiles with the same number touch, they merge into one. Reach the
    <strong>2048</strong> tile to win!
  </p>

  <footer class="footer">
    <p>Built with Claude Code</p>
  </footer>
</div>

<script src="game.js"></script>
</body>
</html>
